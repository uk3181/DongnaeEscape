<!-- 최종적으로 게임이 사용자에게 보여지는 페이지 -->

<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>동래구 기록 복구 프로젝트</title>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			.game-frame {
				width: 100%;
				height: 100%;
				border: none;
			}
		</style>
	</head>
	<body>
		<!-- 내부 게임 프레임 설정 -->
		<iframe class="game-frame" src="main_theme.html"></iframe>
		
		<!-- BGM 설정 -->
		<audio class="bgm-audio" id="muted"
				src="assets/sounds/bgms/main_theme_bgm.mp3" loop></audio>
				
		<!-- Sound 버튼 연결 -->
		<script src="js/sound_button.js"></script>
		<!-- BGM Audio 연결 -->
		<script src="js/bgm_audio.js"></script>
		
		<!-- SFX 설정 -->
		<audio class="sfx-audio"></audio>
		
		<!-- SFX Manager 연결 -->
		<script src="js/sfx_manager.js"></script>
	</body>
</html>
